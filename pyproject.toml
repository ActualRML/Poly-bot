[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Event-driven Polymarket trading bot — WebSocket-first, plugin strategies, dry-run by default."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# We don't ship src/ as an installable package — uv just manages the venv,
# and `python -m src.main` runs from the project root.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
